<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Day 9</title>
</head>
<body>
    <div class="container">
        <div class="containerAnimation">
            <div class="rain">
                <div class="raindrop1"></div>
                <div class="raindrop2"></div>
                <div class="raindrop3"></div>
                <div class="raindrop4"></div>
                <div class="raindrop5"></div>
                <div class="raindrop6"></div>
                <div class="raindrop7"></div>
                <div class="raindrop8"></div>
                <div class="raindrop9"></div>
                <div class="raindrop10"></div>
            </div>
            <div class="moon">
                <div class="crater1"></div>
                <div class="crater2"></div>
                <div class="crater3"></div>
                <div class="crater4"></div>
                <div class="crater5"></div>
                <div class="crater6"></div>
                <div class="crater7"></div>
                <div class="crater8"></div>
                <div class="crater9"></div>
                <div class="crater10"></div>
                <div class="crater11"></div>
                <div class="crater12"></div>
            </div>
            <div class="backCloud">
                <div class="backCloudLeft"></div>
                <div class="backCloudRight"></div>
            </div>
            <div class="frontCloud">
                <div class="frontCloudLeft"></div>
                <div class="frontCloudCenter"></div>
                <div class="frontCloudRight"></div>
            </div>
        </div>
        <div class="containerInformation">
            <div class="currentTemperature">
                <h1>12º</h1>
            </div>
            <div class="weatherInformations">
                <div class="atmosphericParameters">
                    <div class="wind">
                        <p>Wind: E 7 km/h</p>
                    </div>
                    <div class="humidity">
                        <p>Humidity: 87%</p>
                    </div>
                </div>
                <div class="daysInformations">
                    <div class="dayInformation">
                            <p>TUE 21º / 9º</p>
                    </div>
                    <div class="dayInformation">
                            <p>WED 23º / 10º</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
